name: Deploy

on:
  push:
    branches: [ main, develop ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'corretto'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build -x test

      - name: Prepare artifacts
        run: |
          mkdir -p deploy
          cp build/libs/sopkathon.jar deploy/sopkathon.jar
          cp scripts/deploy.sh deploy/deploy.sh

      - name: SCP JAR to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "deploy/sopkathon.jar"
          target: "/home/${{ secrets.EC2_USER }}/app/sopkathon"
          strip_components: 1

      - name: SCP deploy script to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "deploy/deploy.sh"
          target: "/home/${{ secrets.EC2_USER }}/app/sopkathon"
          strip_components: 1

      - name: Execute deploy script
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            chmod +x /home/${{ secrets.EC2_USER }}/app/sopkathon/deploy.sh
            bash /home/${{ secrets.EC2_USER }}/app/sopkathon/deploy.sh
